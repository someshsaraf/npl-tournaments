# docker compose up -d   → http://localhost:8787
# Data (database + uploads) persists in ./data on the host — back it up.
services:
  npl:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
